server:
  port: 8082

spring:
  application:
    name: bets-service
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  messages:
    fallback-to-system-locale: false
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

outbox:
  relay:
    enabled: true
    delay-ms: 200

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, rabbit
      show-details: always

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bets}
    username: ${DB_USER:bets_user}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

admin:
  api-key: ${ADMIN_API_KEY}

---
spring:
  config:
    activate:
      on-profile: test

outbox:
  relay:
    enabled: false

admin:
  api-key: test-admin-api-key

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

admin:
  api-key: ${ADMIN_API_KEY}
